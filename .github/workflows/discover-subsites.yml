name: Discover sub-sites

# Weekly: find idss-mesa repositories that publish an llms.txt under this
# origin (or stopped), update subsites.yml, regenerate the agent surface, and
# open a pull request for a human to review names and outlines.
on:
  schedule:
    - cron: "17 14 * * 1"   # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: discover-subsites
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: 3.x
      - run: pip install pyyaml
      - name: Update subsites.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/discover_subsites.py
      - run: python scripts/gen_agent_surface.py
      - run: python scripts/okf_validate.py okf
      # Needs "Allow GitHub Actions to create and approve pull requests" in
      # the repository's (or organization's) Actions settings.
      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          branch="auto/discover-subsites"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$branch"
          git commit -am "subsites: update from discover_subsites.py"
          git push --force origin "$branch"
          gh pr view "$branch" >/dev/null 2>&1 || gh pr create --head "$branch" \
            --title "Update documentation sub-sites" \
            --body "Generated by the Discover sub-sites workflow. Check the \`name\` and \`outline\` of any added entry in \`subsites.yml\`, add a concept for it in \`okf/concepts/\` with a bullet in \`okf/index.md\`, and rerun \`scripts/gen_agent_surface.py\`."
